[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "numpy",
    "versioneer[toml]>=0.28"
]
build-backend = "setuptools.build_meta"
[tool.ruff]
exclude = [
    "examples",
    "doc",
    "build",
    "dist",
    "csxtools.egg-info",
    "__pycache__"
]

[tool.pytest.ini_options]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "csxtools/_version.py"
versionfile_build = "csxtools/_version.py"
tag_prefix = "v"
parentdir_prefix = "csxtools-"